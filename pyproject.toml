[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flag-omni"
version = "0.0.0"
description = "Triton-based operators for omni-modality generation models in FlagOS"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"

dependencies = [
    "packaging>=23.0",
    "PyYAML>=6.0.1",
    "typing_extensions>=4.0",
]

[project.urls]
Repository = "https://github.com/flagos-ai/FlagOmni"
Issues = "https://github.com/flagos-ai/FlagOmni/issues"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "torch",
    "numpy",
]

[tool.uv]
exclude-dependencies = [
    "torch",
    "triton",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["flag_omni*"]
