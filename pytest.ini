[pytest]
testpaths = tests
pythonpath = src
filterwarnings =
    ignore::pytest.PytestUnknownMarkWarning
    ignore::DeprecationWarning

markers =
    rms_norm: H3 weighted RMS normalization
    packed_swiglu: H3 packed value-gate SwiGLU
    qk_norm_rope: H3 VAE Q/K normalization and rotary embedding
    scaled_residual: H3 VAE residual update
    residual_rms_norm: H3 VAE residual normalization
    reference_blend: H3 reference-blend update
    rotary_tables: H3 rotary position tables
    sage_attention: Quantization-aware SageAttention across supported backends
    benchmark: Explicit performance measurement
