[pytest]
testpaths = tests
pythonpath = src
filterwarnings =
    ignore::pytest.PytestUnknownMarkWarning
    ignore::DeprecationWarning

markers =
    h3_rms_norm: H3 weighted RMS normalization
    h3_swiglu: H3 packed value-gate SwiGLU
    h3_vae_qk_norm_rope: H3 VAE Q/K normalization and rotary embedding
    h3_vae_residual: H3 VAE residual update
    h3_vae_residual_norm: H3 VAE residual normalization
    h3_reference_blend: H3 reference-blend update
    h3_rotary_tables: H3 rotary position tables
    sage_attention: Quantization-aware generic and SM90 SageAttention
    sage_attention_s5000: Final fixed-shape MP31 prequantized SageAttention
    benchmark: Explicit performance measurement
